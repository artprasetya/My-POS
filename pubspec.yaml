name: my_pos
description: A simple, modern, and clean Point of Sale application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^17.1.0

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Backend – Supabase
  supabase_flutter: ^2.8.4

  # Storage
  shared_preferences: ^2.5.4

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.2.2

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Animations
  flutter_animate: ^4.5.2

  # Charts
  fl_chart: ^0.70.2

  # Barcode Scanner
  mobile_scanner: ^6.0.5

  # UUID
  uuid: ^4.5.1

  # Date formatting
  intl: ^0.20.2

  # PDF & Printing
  pdf: ^3.11.2
  printing: ^5.13.4

  # Excel export
  syncfusion_flutter_xlsio: ^28.2.7

  # Path
  path_provider: ^2.1.4

  # Logging
  logger: ^2.6.2

  # Utilities
  flutter_dotenv: ^6.0.0

  # Icons
  iconsax: ^0.0.8

  # Shimmer
  shimmer: ^3.0.0

  # Google Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/icons/app_logo.png"
  android: true
  ios: true
  web:
    generate: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - .env.staging
    - .env.production
